# Gera o APK do app "Granja Suína" a cada envio para o GitHub.
# O APK fica para baixar em: aba "Releases" do repositório (e também em "Actions" → execução → Artifacts).
name: Gerar APK Android

# Só roda quando você pedir: GitHub → Actions → "Gerar APK Android" → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # As máquinas ubuntu do GitHub já trazem o Android SDK instalado.
      - name: Conferir Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/build-tools" "$SDK/platforms"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Gerar imagem do ícone (SVG → PNG 1024px)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/logo.svg -o assets/logo.png

      - name: Criar projeto Android
        run: npx cap add android

      - name: Ícones e tela de abertura
        run: >
          npx capacitor-assets generate --android
          --iconBackgroundColor '#0f3d2b' --iconBackgroundColorDark '#0f3d2b'
          --splashBackgroundColor '#0f3d2b' --splashBackgroundColorDark '#0f3d2b'

      - name: Copiar o app e os plugins para o Android
        run: npx cap sync android

      - name: Número da versão
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      # A chave fica nos "Secrets" do repositório (Settings → Secrets and variables → Actions):
      #   KEYSTORE_BASE64   = conteúdo de assinatura/keystore-base64.txt
      #   KEYSTORE_PASSWORD = conteúdo de assinatura/senha.txt
      - name: Assinar APK (sempre com a mesma chave, para atualizar sem perder dados)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltam os secrets KEYSTORE_BASE64 e KEYSTORE_PASSWORD (veja o README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/granja.keystore"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$IN" aligned.apk
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/granja.keystore" --ks-key-alias granja \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "GranjaSuina-1.0.${GITHUB_RUN_NUMBER}.apk" aligned.apk
          rm -f "$RUNNER_TEMP/granja.keystore"
          "$BT/apksigner" verify --print-certs "GranjaSuina-1.0.${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GranjaSuina-1.0.${{ github.run_number }}
          path: GranjaSuina-*.apk

      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Granja Suína 1.0.${{ github.run_number }}
          body: |
            Baixe o arquivo **GranjaSuina-1.0.${{ github.run_number }}.apk** abaixo no celular Android e toque nele para instalar.
            Se for uma atualização, os dados já salvos no app são mantidos.
          files: GranjaSuina-*.apk
