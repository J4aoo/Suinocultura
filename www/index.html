<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Granja Suína — Gestão Integrada</title>
<meta name="description" content="Aplicativo de gestão para granja de suínos: lotes, manejo, reprodução, financeiro e estoque em um só lugar." />
<meta name="theme-color" content="#0f3d2b" />

<!-- ===== App instalável (PWA): ícone na tela inicial do celular ===== -->
<link rel="manifest" href="manifest.json" />
<meta name="application-name" content="Granja" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Granja" />
<meta name="format-detection" content="telephone=no" />
<link rel="apple-touch-icon" href="icons/app-icon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/app-icon-192.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/app-icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icons/app-icon-512.png" />
<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />

<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app">
  <!-- ============ Navegação lateral ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">🐖</div>
      <div class="brand-text">
        <strong id="brand-name">Granja Suína</strong>
        <span>Gestão Integrada</span>
      </div>
    </div>

    <nav class="nav" aria-label="Navegação principal">
      <div class="nav-group-label">Operação</div>
      <button class="nav-item" data-route="painel"><span class="ico" aria-hidden="true">📊</span> Painel</button>
      <button class="nav-item" data-route="lotes"><span class="ico" aria-hidden="true">🏠</span> Lotes <span class="count" data-count="lotes">0</span></button>
      <button class="nav-item" data-route="manejo"><span class="ico" aria-hidden="true">📝</span> Manejo</button>

      <div class="nav-group-label">Reprodução</div>
      <button class="nav-item" data-route="matrizes"><span class="ico" aria-hidden="true">🐷</span> Matrizes <span class="count" data-count="matrizes">0</span></button>
      <button class="nav-item" data-route="partos"><span class="ico" aria-hidden="true">🍼</span> Partos</button>

      <div class="nav-group-label">Gestão</div>
      <button class="nav-item" data-route="financeiro"><span class="ico" aria-hidden="true">💰</span> Financeiro</button>
      <button class="nav-item" data-route="estoque"><span class="ico" aria-hidden="true">📦</span> Estoque</button>
      <button class="nav-item" data-route="relatorios"><span class="ico" aria-hidden="true">📈</span> Relatórios</button>
      <button class="nav-item" data-route="ajustes"><span class="ico" aria-hidden="true">⚙️</span> Ajustes</button>
    </nav>

    <div class="sidebar-foot">
      <div id="foot-status">Carregando dados…</div>
    </div>
  </aside>
  <div class="scrim-nav" id="scrim-nav" hidden></div>

  <!-- ============ Conteúdo ============ -->
  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Abrir menu" aria-expanded="false">☰</button>
      <div>
        <h1 id="page-title">Painel</h1>
        <div class="sub" id="page-sub">Visão geral da granja</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-sm btn-install" id="btn-instalar" title="Instalar o app na tela inicial" hidden>
          <span aria-hidden="true">📲</span> <span class="lbl-keep">Instalar</span>
        </button>
        <button class="btn btn-sm" id="btn-refresh" title="Recarregar dados"><span aria-hidden="true">↻</span> <span class="lbl">Atualizar</span></button>
        <button class="btn btn-primary btn-sm" id="btn-quick-manejo"><span aria-hidden="true">＋</span> <span class="lbl">Novo manejo</span></button>
      </div>
    </header>

    <main class="view" id="view" tabindex="-1">
      <div class="empty">
        <div class="emoji">🐖</div>
        <h3>Carregando…</h3>
        <p>Buscando os dados da granja.</p>
      </div>
    </main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root" aria-live="polite" aria-atomic="true"></div>

<script src="vendor/chart.umd.min.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/analytics.js"></script>
<script src="js/views.js"></script>
<script src="js/views-repro.js"></script>
<script src="js/views-mgmt.js"></script>
<script src="js/app.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
